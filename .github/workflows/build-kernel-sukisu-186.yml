name: Build Kernel -- K40GE KernelSU/SukiSU with SUSFS (ares 4.14.186 / T)

on:
  workflow_dispatch:
    inputs:
      SOURCECODE_BRANCH:
        description: 'Kernel source branch'
        required: true
        default: 'T'
        type: string
      KERNELSU_BRANCH:
        description: 'KernelSU branch (rsuntk susfs-main has SUSFS built-in)'
        required: true
        default: 'staging/susfs-main'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
    strategy:
      fail-fast: false
    name: Build Kernel for K40GE
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Package
        run: sudo apt update && sudo apt install -y p7zip-full git ccache build-essential flex bison libssl-dev libelf-dev bc python3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Checkout build assets (Patches + Magiskboot/boot.tar.gz) from MerCuJerry
        uses: actions/checkout@v4
        with:
          repository: MerCuJerry/xiaomi_ares_sukisu
          ref: main

      - name: Get Kernel Source Code (Tkpointz/android_kernel_aresin @ T, 4.14.186)
        uses: actions/checkout@v4
        with:
          repository: Tkpointz/android_kernel_aresin
          ref: ${{ inputs.SOURCECODE_BRANCH }}
          path: kernel

      - name: Setup Cross-compile toolchain (Mandi-Sa clang 23 static, proven to compile ares 4.14)
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-23/llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          7za x llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          rm llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z

      - name: Set up KernelSU (rsuntk/KernelSU staging/susfs-main, SUSFS built-in core)
        working-directory: kernel
        run: |
          echo DATE=$(date +%F) >> $GITHUB_ENV
          curl -sSL "https://raw.githubusercontent.com/rsuntk/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s ${{ inputs.KERNELSU_BRANCH }}
          cd ./KernelSU
          KSU_VER=$(expr $(/usr/bin/git rev-list --count HEAD) + 10200)
          echo "KSUVER=$KSU_VER" >> $GITHUB_ENV

      - name: Apply SUSFS (simonpunk/susfs4ksu @ kernel-4.14, file copy - no patch hunk conflicts)
        working-directory: kernel
        run: |
          git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/

      - name: Append KSU/SUSFS config to defconfig
        run: |
          DEF=$GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_user_defconfig
          echo "CONFIG_KSU=y" >> $DEF
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $DEF
          echo "CONFIG_KSU_SUSFS=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEF
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEF
          echo "appended KSU/SUSFS config to $DEF"

      - name: Build Kernel for K40GE
        working-directory: kernel
        env:
          args: |+
            LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3
        run: |
          export PATH=/usr/lib/ccache:$GITHUB_WORKSPACE/toolchain/bin:$PATH
          make -j$(nproc --all) ${args} ares_user_defconfig all

      - name: Pack Kernel using Magiskboot
        working-directory: Magiskboot
        run: |
          tar -xvf boot.tar.gz
          chmod +x magiskboot
          ./magiskboot unpack boot.img
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image ./kernel
          ./magiskboot repack boot.img boot_SukiSU_${{ env.KSUVER }}.img

      - name: Upload repacked boot image
        uses: actions/upload-artifact@v4
        with:
          name: K40GE_SukiSU_${{ env.KSUVER }}
          path: Magiskboot/boot_SukiSU_${{ env.KSUVER }}.img
          compression-level: 9
